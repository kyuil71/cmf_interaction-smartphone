<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>스마트폰 인터랙션 시뮬레이터</title>
<style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #222;
        color: #fff;
        font-family: -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        touch-action: none;
    }

    /* ── 상단 탭 : 시뮬레이터-2와 동일한 스틸 톤으로 통일 ── */
    #tabs {
        position: fixed;
        top: 0; left: 0; right: 0;
        display: flex;
        z-index: 100;
        background: linear-gradient(180deg, #2e343c 0%, #1b1f26 100%);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }
    .tab {
        flex: 1;
        padding: 14px 4px;
        font-size: 14px;
        font-weight: bold;
        color: rgba(255,255,255,0.55);
        border: none;
        background: transparent;
        border-bottom: 3px solid transparent;
        cursor: pointer;
    }
    .tab.active { color: #fff; border-bottom-color: #4fc3f7; }

    /* ── 시작 화면 / 상태 ──────────────────── */
    #btn-start {
        padding: 15px 30px;
        font-size: 18px;
        margin-top: 40vh;
        position: relative;
        z-index: 90;
        border: none;
        background: white;
        color: #222;
        border-radius: 25px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    }
    #status {
        position: fixed;
        left: 0; right: 0; bottom: 18px;
        z-index: 95;
        font-size: 15px;
        font-weight: bold;
        text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
        pointer-events: none;
        padding: 0 12px;
    }
    #status.on-light { color: #4a4a48; text-shadow: 0 1px 2px rgba(255,255,255,0.8); }

    /* ── 패널 ─────────────────────────────── */
    .panel { position: absolute; inset: 0; display: none; }
    .panel.active { display: block; }

    /* 시뮬레이터-1 : 기본 공 (지름 92px, 2번과 동일) */
    #ball1 {
        width: 92px; height: 92px;
        background: crimson;
        border-radius: 50%;
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        transition: transform 0.18s cubic-bezier(.34,1.56,.64,1);
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        cursor: pointer;
    }

    /* 시뮬레이터-2 : 크롬 금속 공 (캔버스) — 위에서 내려다본 시점 */
    #panel2 {
        background:
            radial-gradient(circle at 50% 28%, rgba(150, 180, 210, 0.16) 0%, rgba(0,0,0,0) 60%),
            radial-gradient(circle at 50% 50%, #2b3138 0%, #1d2228 55%, #10141a 100%);
    }
    #metal-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* 시뮬레이터-3 : 하얀 천 캔버스 */
    #panel3 { background: #efede8; }
    #cloth-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .tab { white-space: nowrap; letter-spacing: -0.5px; font-size: min(14px, 3.3vw); padding: 14px 2px; }

    /* 시뮬레이터-4 : Adaptive Gravity Music (자이로 뮤직 인터랙션) */
    #panel4 { background: #0b0d12; }
    .p4-wrap {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        padding: 56px 0 50px; text-align: left; box-sizing: border-box;
    }
    .np4 {
        display: flex; align-items: center; gap: 12px; margin: 4px 14px 0;
        padding: 10px 12px; border-radius: 18px;
        background: linear-gradient(180deg, #151923, #0f1219);
        border: 1px solid rgba(255,255,255,.07);
    }
    .np4 img { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; background: #1a1c22; flex: none; }
    .np4-meta { flex: 1; min-width: 0; }
    .np4-t { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np4-a { font-size: 13px; color: #9aa3b2; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np4-bar { height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); margin-top: 7px; overflow: hidden; }
    .np4-bar i { display: block; height: 100%; width: 0; background: #7dd3fc; transition: width .4s linear; }
    .np4-vol { font-size: 15px; font-weight: 700; color: #7dd3fc; min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }

    .p4-stage {
        position: relative; flex: 1; min-height: 0; margin: 10px 14px 0; border-radius: 26px; overflow: hidden;
        background:
            radial-gradient(circle at 74% 82%, rgba(125,211,252,.10), transparent 26%),
            linear-gradient(180deg, #10141d, #0b0e14);
        border: 1px solid rgba(255,255,255,.06);
    }
    #canvas4 { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
    .p4-zone {
        position: absolute; right: 49px; bottom: 53px; width: 132px; height: 132px; z-index: 1;   /* 파란 원은 원래 크기, 중심은 v8과 동일 */
        border: 1.5px dashed rgba(125,211,252,.45); border-radius: 50%;
        display: flex; align-items: center; justify-content: center; text-align: center;
        color: #8cc9e8; font-size: 12px; pointer-events: none;
        transition: box-shadow .35s, border-color .35s, background .35s;
    }
    /* 끌어당김 범위 표시 (존 반지름 × 1.5) */
    .p4-zone::before {
        content: ""; position: absolute; inset: -62.5%; border-radius: 50%;   /* 끌어당김 범위 반지름 ≈148px 유지 */
        border: 1px dashed rgba(125,211,252,.18);
        background: radial-gradient(circle, rgba(125,211,252,.05) 60%, rgba(125,211,252,0) 72%);
    }
    .p4-zone.lit {
        border-style: solid; border-color: rgba(125,211,252,.8);
        background: radial-gradient(circle, rgba(0,0,0,.35) 30%, rgba(125,211,252,.08) 70%);
        box-shadow: 0 0 0 6px rgba(125,211,252,.12), inset 0 6px 14px rgba(0,0,0,.55);
    }
    .b4 {
        position: absolute; width: 84px; height: 84px; border-radius: 50%; z-index: 2;
        border: 1px solid rgba(255,255,255,.1);
        background: linear-gradient(180deg, #222838, #171c28);
        color: #fff; display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 14px; letter-spacing: .2px; font-family: inherit;
        box-shadow: 0 8px 26px rgba(0,0,0,.35);
        transition: left .55s cubic-bezier(.2,.85,.25,1), top .55s cubic-bezier(.2,.85,.25,1),
                    transform .22s ease, opacity .18s ease;
        user-select: none; -webkit-user-select: none; touch-action: none; cursor: pointer; padding: 0;
    }
    .b4:active { transform: scale(.94); }
    .b4.as-ball { opacity: 0; pointer-events: none; }
    .knob-ring {
        position: absolute; inset: -7px; border-radius: 50%; pointer-events: none;
        -webkit-mask: radial-gradient(circle, transparent 44.5px, #000 45.5px);
                mask: radial-gradient(circle, transparent 44.5px, #000 45.5px);
    }
    .knob-dot {
        position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
        border-radius: 50%; background: #7dd3fc; box-shadow: 0 0 6px rgba(125,211,252,.8);
        transform: rotate(var(--ang, 0deg)) translateY(-31px); pointer-events: none;
    }
    .knob-lb { display: flex; flex-direction: column; align-items: center; line-height: 1.1; font-size: 11px; color: #9aa3b2; pointer-events: none; }
    .knob-lb b { font-size: 17px; color: #fff; font-variant-numeric: tabular-nums; }
    .p4-stat { display: none !important; }
    .p4-stat-unused {
        position: absolute; left: 16px; right: 16px; top: 14px; z-index: 4; pointer-events: none;
        font-size: 14px; color: #d6dbe6; line-height: 1.45;
    }
    .p4-ctrl { padding: 10px 16px 0; }
    /* 우측 상단 수동/자동 토글 : 켜짐 = 기울여서 굴리기, 꺼짐 = 구슬이 스스로 엄지 존으로 */
    .p4-manual {
        position: absolute; top: 12px; right: 12px; z-index: 5;
        height: 34px; padding: 0 14px; border-radius: 17px; font: inherit; font-size: 13px; font-weight: 700;
        border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #8b93a3; cursor: pointer;
        display: flex; align-items: center; gap: 7px; transition: background .2s, color .2s, border-color .2s;
    }
    .p4-manual::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #4b5263; transition: background .2s, box-shadow .2s; }
    .p4-manual.on { background: rgba(125,211,252,.16); border-color: rgba(125,211,252,.55); color: #d8f1ff; }
    .p4-manual.on::before { background: #7dd3fc; box-shadow: 0 0 8px rgba(125,211,252,.9); }
    .p4-row { display: flex; align-items: center; gap: 10px; }
    .p4-row label { font-size: 13px; color: #9aa3b2; white-space: nowrap; }
    .p4-row input[type=range] { flex: 1; min-width: 0; }
    .p4-row button {
        flex: none; border: 0; border-radius: 12px; padding: 9px 12px; font: inherit; font-size: 13px; font-weight: 700;
        background: rgba(255,255,255,.1); color: #fff; cursor: pointer;
    }
    .p4-readout { margin-top: 8px; font-size: 13px; color: #9aa3b2; line-height: 1.45; font-variant-numeric: tabular-nums; }
    .p4-readout b { color: #7dd3fc; }

    /* 시뮬레이터-5 : 기울기 한 손 자판 (삼성 키보드 스타일) */
    #panel5 { background: #000; }
    .p5-wrap {
        position: absolute; inset: 0; display: flex; flex-direction: column; text-align: left;
        padding: 50px 0 calc(6px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box;
        max-width: 430px; margin: 0 auto;
    }
    #panel5.wide .p5-wrap { max-width: none; }
    #panel5.wide .k5 { height: 50px; }
    .p5-ctrl { padding: 8px 14px 6px; }
    .p5-ctrl .p4-row button.on { background: #3e91ff; }
    .p5-mode { flex: none; font-size: 13px; font-weight: 700; color: #cfe3ff; min-width: 52px; text-align: right; }
    .p5-chat {
        flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 0 10px;
        border-radius: 24px; background: #101012; border: 1px solid rgba(255,255,255,.06); overflow: hidden;
    }
    .p5-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.06); }
    .p5-ava { width: 34px; height: 34px; border-radius: 50%; background: #5b6cff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex: none; }
    .p5-name { font-size: 16px; font-weight: 700; }
    .p5-sub { font-size: 12px; color: #8e8e93; }
    .p5-msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 12px 6px; touch-action: pan-y; display: flex; flex-direction: column; gap: 6px; }
    .p5-b { max-width: 78%; padding: 9px 13px; border-radius: 20px; font-size: 16px; line-height: 1.4; white-space: pre-wrap; word-break: break-all; }
    .p5-b.in  { align-self: flex-start; background: #2c2c2e; border-bottom-left-radius: 6px; }
    .p5-b.out { align-self: flex-end; background: #3e7cf6; border-bottom-right-radius: 6px; }
    .p5-t { font-size: 11px; color: #8e8e93; align-self: flex-end; margin: -2px 4px 2px; }
    .p5-comp { display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px 10px; }
    .p5-field {
        flex: 1; min-height: 40px; max-height: 96px; overflow-y: auto; box-sizing: border-box;
        padding: 9px 14px; border-radius: 20px; background: #1f1f22; border: 1.5px solid #3e91ff;
        font-size: 16px; line-height: 1.35; white-space: pre-wrap; word-break: break-all; color: #fff;
    }
    .p5-field .ph { color: #6c6c70; }
    .p5-field u { text-decoration: none; background: rgba(62,145,255,.28); border-bottom: 2px solid #3e91ff; }
    .p5-caret { display: inline-block; width: 2px; height: 1.15em; margin-left: 1px; vertical-align: -3px; background: #3e91ff; animation: p5blink 1s steps(1) infinite; }
    @keyframes p5blink { 50% { opacity: 0; } }
    .p5-send {
        flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0;
        background: #3e7cf6; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer;
    }
    .p5-send:disabled { background: #2c2c2e; color: #636366; }
    .p5-len { font-size: 11px; color: #8e8e93; text-align: right; padding: 0 16px 2px; min-height: 14px; }

    /* 자판 본체 */
    .kb5 { position: relative; margin-top: 8px; background: #121214; padding: 6px 0 4px; user-select: none; -webkit-user-select: none; }
    .kb5-tool { display: flex; justify-content: space-around; align-items: center; height: 34px; color: #b8b8be; font-size: 16px; }
    .kb5-tool span { opacity: .85; }
    .kb5-board { position: relative; touch-action: none; }
    .k5-row { display: flex; gap: 5px; margin: 0 4px 8px; }
    .k5-row:last-child { margin-bottom: 2px; }
    .k5 {
        position: relative; flex: 1 1 0; min-width: 0; height: 46px; border-radius: 9px;
        background: #3a3a3d; color: #f2f2f7; display: flex; align-items: center; justify-content: center;
        font-size: 20px; font-weight: 400; box-shadow: 0 1px 0 rgba(0,0,0,.6);
        cursor: pointer; transition: background .06s;
    }
    .k5.fn { background: #28282b; font-size: 15px; font-weight: 600; color: #d1d1d6; }
    .k5.sp { flex-grow: 4; font-size: 14px; color: #8e8e93; }
    .k5.w13 { flex-grow: 1.3; } .k5.w15 { flex-grow: 1.5; } .k5.w11 { flex-grow: 1.1; }
    .k5.gap { flex-grow: .5; visibility: hidden; }
    .k5.down { background: #5a5a5f; }
    .k5.fn.down { background: #48484c; }
    .k5.lit { color: #3e91ff; }
    .k5.lock { color: #3e91ff; box-shadow: inset 0 -3px 0 #3e91ff; }
    .k5 sup { position: absolute; top: 3px; right: 5px; font-size: 10px; color: #8e8e93; }
    .k5-pop {
        position: absolute; z-index: 10; pointer-events: none; display: none;
        min-width: 44px; height: 56px; padding: 0 6px; box-sizing: border-box; border-radius: 12px;
        background: #5a5a5f; color: #fff; font-size: 28px; align-items: center; justify-content: center;
        box-shadow: 0 6px 18px rgba(0,0,0,.5);
    }
    .kb5-side {
        position: absolute; top: 40px; bottom: 4px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; opacity: 0; pointer-events: none;
    }
    .kb5-side button {
        width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0;
        background: #28282b; color: #e5e5ea; font-size: 18px; cursor: pointer;
    }
</style>
</head>
<body>

<div id="tabs">
    <button class="tab active" data-sim="1">시뮬레이터-1</button>
    <button class="tab" data-sim="2">시뮬레이터-2</button>
    <button class="tab" data-sim="3">시뮬레이터-3</button>
    <button class="tab" data-sim="4">시뮬레이터-4</button>
    <button class="tab" data-sim="5">시뮬레이터-5</button>
</div>

<button id="btn-start">프로그램 시작하기 (권한 허용)</button>
<div id="status">버튼을 눌러 시작하세요.</div>

<div class="panel active" id="panel1">
    <div id="ball1"></div>
</div>

<div class="panel" id="panel2">
    <canvas id="metal-canvas"></canvas>
</div>

<div class="panel" id="panel3">
    <canvas id="cloth-canvas"></canvas>
</div>

<div class="panel" id="panel4">
  <div class="p4-wrap">
    <div class="np4">
      <img id="np4Art" alt="">
      <div class="np4-meta">
        <div class="np4-t" id="np4Title"></div>
        <div class="np4-a" id="np4Artist"></div>
        <div class="np4-bar"><i id="np4Prog"></i></div>
      </div>
      <div class="np4-vol" id="np4Vol">70%</div>
    </div>
    <section class="p4-stage" id="stage4">
      <div class="p4-zone" id="zone4">THUMB<br>ZONE</div>
      <button class="p4-manual" id="manual4" aria-pressed="false">수동</button>
      <button class="b4" id="b4-play">PLAY</button>
      <button class="b4 knob" id="b4-volume" aria-label="볼륨 (돌려서 조절)">
        <span class="knob-ring" id="b4Ring"></span><span class="knob-dot"></span>
        <span class="knob-lb">VOL<b id="b4VolN">70</b></span>
      </button>
      <button class="b4 knob" id="b4-next" aria-label="다음·이전 곡 (돌려서 선택)">
        <span class="knob-dot"></span>
        <span class="knob-lb">◀ ▶<b>NEXT</b></span>
      </button>
      <canvas id="canvas4"></canvas>
      <div class="p4-stat" id="stat4">1단계 · PLAY 차례</div>
    </section>
    <section class="p4-ctrl">
      <div class="p4-row">
        <label for="tilt4">기울기</label>
        <input id="tilt4" type="range" min="-20" max="20" value="0" step="1">
        <button id="calib4">기준 재설정</button>
        <button id="shake4" title="센서가 없을 때 흔들기를 흉내 냅니다">흔들기</button>
      </div>
      <div class="p4-readout" id="readout4">센서 대기 · 슬라이더로 기울기를 흉내 낼 수 있어요</div>
    </section>
  </div>
</div>

<div class="panel" id="panel5">
  <div class="p5-wrap">
    <section class="p5-ctrl">
      <div class="p4-row">
        <label for="tilt5">기울기</label>
        <input id="tilt5" type="range" min="-25" max="25" value="0" step="1">
        <button id="calib5">기준 재설정</button>
        <span class="p5-mode" id="mode5">가운데</span>
      </div>
      <div class="p4-readout" id="readout5">센서 대기 · 슬라이더로 기울기를 흉내 낼 수 있어요</div>
    </section>
    <section class="p5-chat">
      <div class="p5-head">
        <div class="p5-ava">랩</div>
        <div><div class="p5-name">디자인 리서치 랩</div><div class="p5-sub">자판 테스트</div></div>
      </div>
      <div class="p5-msgs" id="msgs5">
      </div>
      <div class="p5-comp">
        <div class="p5-field" id="field5"></div>
        <button class="p5-send" id="send5" aria-label="보내기" disabled>↑</button>
      </div>
      <div class="p5-len" id="len5"></div>
    </section>
    <section class="kb5" id="kb5">
      <div class="kb5-tool"><span>☺</span><span>🎤</span><span>⚙</span><span>▢</span><span>…</span></div>
      <div class="kb5-board" id="board5"></div>
      <div class="kb5-side" id="side5">
        <button id="swap5" aria-label="반대쪽으로 옮기기">⇆</button>
        <button id="full5" aria-label="자판 전체 크기로">⤢</button>
      </div>
      <div class="k5-pop" id="pop5"></div>
    </section>
  </div>
</div>

<script>
/* ═════════════════════════════════════════════
   공통 상태
═════════════════════════════════════════════ */
const statusDiv = document.getElementById('status');
const btnStart  = document.getElementById('btn-start');

let activeSim = 1;
let started = false;

let rawGamma = 0, rawBeta = 0;
let gamma = 0, beta = 0;

const BALL_R = 46;   // 공통 공 반지름 (지름 92px)

/* ═════════════════════════════════════════════
   햅틱(진동) 유틸리티
   Vibration API가 지원되는 스마트폰에서만 동작.
   너무 자주 호출하지 않도록 최소 간격을 강제하고,
   시뮬레이터별로 다른 패턴을 사용해 표면 질감을 표현한다.
═════════════════════════════════════════════ */
const hasVibrate = typeof navigator !== 'undefined' &&
                   typeof navigator.vibrate === 'function';
let vibeUnlocked = false;              // 첫 사용자 제스처 이후에만 실제 동작
let lastVibeAt = 0;
function vibe(pattern) {
    if (!hasVibrate || !vibeUnlocked) return;
    const now = performance.now();
    if (now - lastVibeAt < 22) return;   // 초당 45회 상한
    lastVibeAt = now;
    try { navigator.vibrate(pattern); } catch (e) {}
}
// 다음번 굴러가는 진동을 언제 낼지 관리

   시작 : 움직임 센서 권한
═════════════════════════════════════════════ */
/* [수정] requestPermission()은 이제 iOS 전용이 아님.
   안드로이드 Chrome 150+도 같은 함수를 갖고 있고, 사이트의 '동작 센서' 권한이 차단돼 있으면
   팝업 없이 곧바로 "denied"를 돌려준다. 기존 코드는 이를 '거부'로 보고 리스너조차 달지 않았다.
   → 결과와 상관없이 리스너를 달고, 1.5초 안에 실제 값이 오는지로 판단한 뒤 원인을 정확히 안내한다. */
let gotOri = false, oriBeta = 0, oriGamma = 0;
const UA = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/i.test(UA);
function howToAllow() {
    if (isIOS) return "iPhone: 설정 › 앱 › Safari › '동작 및 방향 접근'을 켠 뒤 새로고침하세요.";
    if (/SamsungBrowser/i.test(UA)) return "삼성 인터넷: 주소창 왼쪽 자물쇠 › 권한 › '동작 센서' 허용 후 새로고침하세요.";
    if (isAndroid) return "Chrome: 주소창 왼쪽 아이콘 › 권한 › '동작 센서' 허용 (또는 설정 › 사이트 설정 › 동작 센서) 후 새로고침하세요.";
    return "PC에는 자이로 센서가 없습니다. 마우스(1~3번) 또는 슬라이더(4번)로 확인하세요.";
}
btnStart.addEventListener('click', async () => {
    btnStart.style.display = 'none';
    statusDiv.innerText = "센서 확인 중...";
    started = true;

    // 사용자 제스처 안에서 진동 API를 한 번 호출해 잠금 해제
    if (hasVibrate) {
        try { navigator.vibrate(1); vibeUnlocked = true; } catch (e) {}
    }
    ensureCtx4(); warm4();

    if (typeof DeviceOrientationEvent === 'undefined') {
        statusDiv.innerText = window.isSecureContext
            ? "이 브라우저는 방향 센서를 지원하지 않습니다."
            : "https 주소로 열어야 센서가 동작합니다.";
        return;
    }
    // iOS : 흔들기용 가속도 권한도 같은 탭 안에서 동시에 요청 (await 뒤에 부르면 제스처가 끊김)
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try { DeviceMotionEvent.requestPermission().catch(() => {}); } catch (e) {}
    }
    let perm = 'not-required';
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        try { perm = await DeviceOrientationEvent.requestPermission(); }
        catch (e) { perm = 'error'; }
    }
    window.removeEventListener('deviceorientation', handleOrientation);
    window.addEventListener('deviceorientation', handleOrientation);
    enableShake4();

    setTimeout(() => {
        if (gotOri) { statusDiv.innerText = "스마트폰을 기울여 공을 굴려보세요!"; return; }
        let msg;
        if (!window.isSecureContext) msg = "https가 아닌 주소라 센서가 막혔습니다. https 주소로 여세요.";
        else if (window.self !== window.top) msg = "다른 페이지 안(iframe)에 들어 있어 센서가 막혔습니다. 단독 탭으로 여세요.";
        else if (perm === 'denied' || perm === 'error') msg = "동작 센서 권한이 차단돼 있습니다. " + howToAllow();
        else if (!isAndroid && !isIOS) msg = howToAllow();
        else msg = "센서 값이 오지 않습니다. 카카오톡 등 앱 내 브라우저라면 Chrome으로 여시고, 빠른 설정의 '센서 끄기'를 확인하세요.";
        statusDiv.innerText = msg;
        btnStart.textContent = "권한 허용 후 다시 시도";
        btnStart.style.display = '';
    }, 1500);
});

function handleOrientation(event) {
    if (typeof event.gamma !== 'number' || typeof event.beta !== 'number') return;
    gotOri = true;
    rawGamma = oriGamma = event.gamma;
    rawBeta  = oriBeta  = event.beta;
}

// 데스크톱 미리보기 : 마우스로 기울기 흉내
window.addEventListener('mousemove', (e) => {
    if (!started || gotOri) return;
    rawGamma = ((e.clientX / window.innerWidth)  - 0.5) * 60;
    rawBeta  = ((e.clientY / window.innerHeight) - 0.5) * 60;
});

/* ═════════════════════════════════════════════
   금속 공 상태 (시뮬레이터-2, 3 공유)
═════════════════════════════════════════════ */
function makeBallState() {
    return {
        x: null, y: null, vx: 0, vy: 0,
        rollAngle: 0,
        scale: 1, scaleTarget: 1, scaleVel: 0
    };
}
const B2 = makeBallState();
const B3 = makeBallState();
B3.hold = false; B3.sink = 0; B3.sinkVel = 0; B3.sinkTick = 0;

const flecks = [];
for (let i = 0; i < 7; i++) {
    flecks.push({
        phase: Math.random() * Math.PI * 2,
        perp:  (Math.random() - 0.5) * 1.3,
        size:  0.06 + Math.random() * 0.09,
        alpha: 0.05 + Math.random() * 0.07
    });
}

function updateScaleSpring(B) {
    B.scaleVel += (B.scaleTarget - B.scale) * 0.25;
    B.scaleVel *= 0.72;
    B.scale += B.scaleVel;
}

/* ═════════════════════════════════════════════
   공유 크롬 볼 렌더러 (2번·3번 동일)
═════════════════════════════════════════════ */
function drawChromeBall(c, B, R, W, H, t, env) {
    const x = B.x, y = B.y;
    const speed = Math.hypot(B.vx, B.vy);

    const lightX = W / 2, lightY = -H * 0.25;
    let dx = lightX - x, dy = lightY - y;
    const dist = Math.hypot(dx, dy) || 1;
    dx /= dist; dy /= dist;
    const hx = x + dx * R * 0.42 - gamma * 0.4;
    const hy = y + dy * R * 0.42 - beta * 0.4;

    c.save();
    c.beginPath();
    c.arc(x, y, R, 0, Math.PI * 2);
    c.clip();

    // ① 크롬 본체
    const body = c.createRadialGradient(hx, hy, R * 0.05, x, y, R * 1.05);
    body.addColorStop(0,    '#ffffff');
    body.addColorStop(0.18, '#e9eef2');
    body.addColorStop(0.42, '#aab4bd');
    body.addColorStop(0.68, '#67727c');
    body.addColorStop(0.9,  '#2e353c');
    body.addColorStop(1,    '#171c21');
    c.fillStyle = body;
    c.fillRect(x - R, y - R, R * 2, R * 2);

    // ② 화면 정렬 환경 반사 밴드
    const bandShift = -beta * 0.6;
    const envG = c.createLinearGradient(x, y - R + bandShift, x, y + R + bandShift);
    envG.addColorStop(0,    'rgba(235, 245, 252, 0.5)');
    envG.addColorStop(0.38, 'rgba(255, 255, 255, 0.12)');
    envG.addColorStop(0.5,  'rgba(15, 25, 35, 0.55)');
    envG.addColorStop(0.58, 'rgba(120, 140, 158, 0.25)');
    if (env === 'cloth') {
        envG.addColorStop(0.8, 'rgba(248, 246, 240, 0.55)');
        envG.addColorStop(1,   'rgba(238, 235, 228, 0.65)');
    } else {
        envG.addColorStop(0.8, 'rgba(35, 42, 50, 0.5)');
        envG.addColorStop(1,   'rgba(12, 16, 20, 0.6)');
    }
    c.fillStyle = envG;
    c.fillRect(x - R, y - R, R * 2, R * 2);

    // ③ 아래쪽 바운스 라이트
    const bounce = c.createRadialGradient(x, y + R * 0.9, 0, x, y + R * 0.9, R * 1.1);
    if (env === 'cloth') {
        bounce.addColorStop(0, 'rgba(255, 253, 248, 0.5)');
        bounce.addColorStop(1, 'rgba(255, 253, 248, 0)');
    } else {
        bounce.addColorStop(0, 'rgba(120, 145, 170, 0.25)');
        bounce.addColorStop(1, 'rgba(120, 145, 170, 0)');
    }
    c.fillStyle = bounce;
    c.fillRect(x - R, y - R, R * 2, R * 2);

    // ④ 구르는 표면 흠집
    let dirx = 0, diry = 1;
    if (speed > 0.05) { dirx = B.vx / speed; diry = B.vy / speed; }
    for (const f of flecks) {
        const ph = f.phase + B.rollAngle;
        const s = Math.sin(ph), cn = Math.cos(ph);
        if (cn < 0.12) continue;
        const along = s * R * 0.78;
        const perp  = f.perp * R * 0.6;
        const fx = x + dirx * along - diry * perp;
        const fy = y + diry * along + dirx * perp;
        if (Math.hypot(fx - x, fy - y) > R * 0.92) continue;
        c.beginPath();
        c.ellipse(fx, fy, R * f.size * cn + 1, R * f.size * 0.55, Math.atan2(diry, dirx), 0, Math.PI * 2);
        c.fillStyle = `rgba(255,255,255,${f.alpha * cn})`;
        c.fill();
    }

    // ⑤ 스펙큘러 (속도 방향으로 살짝 번짐)
    const stretch = Math.min(1.8, 1 + speed * 0.06);
    c.save();
    c.translate(hx, hy);
    c.rotate(Math.atan2(B.vy, B.vx));
    c.scale(stretch, 1);
    const spec = c.createRadialGradient(0, 0, 0, 0, 0, R * 0.32);
    spec.addColorStop(0,    'rgba(255,255,255,1)');
    spec.addColorStop(0.18, 'rgba(255,255,255,0.85)');
    spec.addColorStop(1,    'rgba(255,255,255,0)');
    c.fillStyle = spec;
    c.fillRect(-R, -R, R * 2, R * 2);
    c.restore();

    // ⑥ 보조 하이라이트
    const spec2 = c.createRadialGradient(x - dx * R * 0.55, y - dy * R * 0.55 + R * 0.2, 0,
                                         x - dx * R * 0.55, y - dy * R * 0.55 + R * 0.2, R * 0.35);
    spec2.addColorStop(0, 'rgba(210, 235, 255, 0.35)');
    spec2.addColorStop(1, 'rgba(210, 235, 255, 0)');
    c.fillStyle = spec2;
    c.fillRect(x - R, y - R, R * 2, R * 2);

    // ⑦ 가장자리 어두운 림
    const rim = c.createRadialGradient(x, y, R * 0.6, x, y, R);
    rim.addColorStop(0, 'rgba(0,0,0,0)');
    rim.addColorStop(0.85, 'rgba(0,0,0,0.18)');
    rim.addColorStop(1, 'rgba(0,0,0,0.45)');
    c.fillStyle = rim;
    c.fillRect(x - R, y - R, R * 2, R * 2);

    c.restore();

    // ⑧ 프레넬 엣지
    const la = Math.atan2(dy, dx);
    c.beginPath();
    c.arc(x, y, R - 1, la - 1.1, la + 1.1);
    c.strokeStyle = 'rgba(255,255,255,0.5)';
    c.lineWidth = 1.6;
    c.stroke();
    c.beginPath();
    c.arc(x, y, R - 1, la + Math.PI - 0.7, la + Math.PI + 0.7);
    c.strokeStyle = env === 'cloth' ? 'rgba(250,248,242,0.45)' : 'rgba(160,180,200,0.22)';
    c.lineWidth = 1.2;
    c.stroke();
}

/* ═════════════════════════════════════════════
   메인 루프
═════════════════════════════════════════════ */
let lastT = 0;
function loop(t) {
    const dt = Math.min(32, t - lastT) / 16.67;
    lastT = t;

    gamma += (rawGamma - gamma) * 0.12;
    beta  += (rawBeta  - beta)  * 0.12;

    if (activeSim === 1 && started) updateSim1();
    if (activeSim === 2)            updateSim2(t, dt);
    if (activeSim === 3)            updateSim3(t, dt);
    if (activeSim === 4)            updateSim4(t, dt);
    if (activeSim === 5)            updateSim5(t, dt);

    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ═════════════════════════════════════════════
   시뮬레이터-1
═════════════════════════════════════════════ */
function updateSim1() {
    let posX = (window.innerWidth  / 2) + (gamma * 6);
    let posY = (window.innerHeight / 2) + (beta  * 6);
    posX = Math.max(BALL_R, Math.min(window.innerWidth  - BALL_R, posX));
    posY = Math.max(BALL_R, Math.min(window.innerHeight - BALL_R, posY));
    ball1.style.left = posX + 'px';
    ball1.style.top  = posY + 'px';
}

/* ═════════════════════════════════════════════
   시뮬레이터-2 : 어두운 스튜디오 바닥 위의 크롬 공
═════════════════════════════════════════════ */
const mCanvas = document.getElementById('metal-canvas');
const mCtx = mCanvas.getContext('2d');

function resizeMetal() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    mCanvas.width  = window.innerWidth  * dpr;
    mCanvas.height = window.innerHeight * dpr;
    mCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeMetal);
resizeMetal();

function updateSim2(t, dt) {
    const W = window.innerWidth, H = window.innerHeight;
    const R0 = BALL_R;
    if (B2.x === null) { B2.x = W / 2; B2.y = H / 2; }

    if (started) {
        const gAcc = 0.42;
        B2.vx += Math.sin(gamma * Math.PI / 180) * gAcc * dt;
        B2.vy += Math.sin(beta  * Math.PI / 180) * gAcc * dt;
        B2.vx *= Math.pow(0.988, dt);
        B2.vy *= Math.pow(0.988, dt);
        B2.x += B2.vx * dt;
        B2.y += B2.vy * dt;

        const topLimit = R0 + 54;
        let hit2 = 0;
        if (B2.x < R0)      { B2.x = R0;      hit2 = Math.abs(B2.vx); B2.vx = -B2.vx * 0.62; }
        if (B2.x > W - R0)  { B2.x = W - R0;  hit2 = Math.abs(B2.vx); B2.vx = -B2.vx * 0.62; }
        if (B2.y < topLimit){ B2.y = topLimit; hit2 = Math.max(hit2, Math.abs(B2.vy)); B2.vy = -B2.vy * 0.62; }
        if (B2.y > H - R0)  { B2.y = H - R0;  hit2 = Math.max(hit2, Math.abs(B2.vy)); B2.vy = -B2.vy * 0.62; }
        if (hit2 > 0.6) vibe(Math.min(35, 8 + hit2 * 2) | 0);   // 강할수록 진한 탁 소리

        B2.rollAngle += Math.hypot(B2.vx, B2.vy) * dt / R0;

        // 유리판 위 쇠공의 굴러가는 진동 : 속도가 있으면 자주·짧게 톡톡
        const sp2 = Math.hypot(B2.vx, B2.vy);
        if (sp2 > 0.35) {
            rollTick2 -= dt * (0.6 + sp2 * 0.35);      // 빠를수록 자주
            if (rollTick2 <= 0) {
                const d = Math.min(12, 3 + sp2 * 0.7);
                vibe(d | 0);
                rollTick2 = 3.5 + Math.random() * 1.5;
            }
        } else rollTick2 = 0;
    }

    updateScaleSpring(B2);
    const R = R0 * B2.scale;
    const speed = Math.hypot(B2.vx, B2.vy);

    mCtx.clearRect(0, 0, W, H);

    /* 위에서 내려다본 시점의 그림자 :
       폰 상단에 고정된 광원의 반대 방향으로, 광원에서 멀수록 조금 더 길게 떨어짐 */
    const lightX = W / 2, lightY = -H * 0.25;
    let dx = lightX - B2.x, dy = lightY - B2.y;
    const d = Math.hypot(dx, dy) || 1;
    dx /= d; dy /= d;

    const so = R * (0.45 + d / (H * 2.2));          // 그림자 오프셋
    const shx = B2.x - dx * so - B2.vx * 1.2;        // 움직이면 살짝 끌림
    const shy = B2.y - dy * so - B2.vy * 1.2;
    const sh = mCtx.createRadialGradient(shx, shy, R * 0.15, shx, shy, R * 1.3);
    sh.addColorStop(0,   'rgba(0,0,0,0.5)');
    sh.addColorStop(0.6, 'rgba(0,0,0,0.22)');
    sh.addColorStop(1,   'rgba(0,0,0,0)');
    mCtx.beginPath();
    mCtx.ellipse(shx, shy,
        R * 1.18 * (1 + Math.min(0.4, speed * 0.035)),   // 속도 방향으로 살짝 늘어남
        R * 1.06,
        Math.atan2(-dy, -dx), 0, Math.PI * 2);
    mCtx.fillStyle = sh;
    mCtx.fill();

    // 공 바로 밑의 진한 접촉 음영 (탑뷰에서 공 가장자리로 살짝 비어져 나옴)
    const ao2 = mCtx.createRadialGradient(B2.x, B2.y, R * 0.85, B2.x, B2.y, R * 1.18);
    ao2.addColorStop(0, 'rgba(0,0,0,0.30)');
    ao2.addColorStop(1, 'rgba(0,0,0,0)');
    mCtx.beginPath();
    mCtx.arc(B2.x, B2.y, R * 1.18, 0, Math.PI * 2);
    mCtx.fillStyle = ao2;
    mCtx.fill();

    drawChromeBall(mCtx, B2, R, W, H, t, 'floor');
}

mCanvas.addEventListener('pointerdown', (e) => {
    const rect = mCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (B2.x !== null && Math.hypot(mx - B2.x, my - B2.y) < 62) {
        e.preventDefault();
        B2.scaleTarget = 1.35;
        // 유리판 위 쇠공 : 짧고 날카로운 딱 소리 같은 진동 (탁-탁)
        vibe([14, 20, 8]);
    }
});
['pointerup', 'pointercancel'].forEach(ev =>
    mCanvas.addEventListener(ev, () => { B2.scaleTarget = 1; }));

/* ═════════════════════════════════════════════
   시뮬레이터-3 : 하얀 천 위를 구르는 크롬 공
   ─ 첨부 CMF LAB의 FABRIC 시뮬레이션 방식 이식 ─
   · 직조 실(warp/weft) 격자가 임팩트에 의해
     안쪽으로 당겨지고(장력), 물결치고(탄성),
     드래그 파동이 퍼지며 실제 천처럼 변형된다
   · 임팩트는 '공'이 만든다 : 공이 있는 자리는
     항상 눌려 있고, 굴러간 자리에는 임팩트가
     남았다가 복원 속도에 따라 서서히 회복된다
   · 배경(천)을 손으로 터치하는 눌림 효과는 없음
═════════════════════════════════════════════ */
const cCanvas = document.getElementById('cloth-canvas');
const cCtx = cCanvas.getContext('2d');

function resizeCloth() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cCanvas.width  = window.innerWidth  * dpr;
    cCanvas.height = window.innerHeight * dpr;
    cCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCloth);
resizeCloth();

/* 천 물성 (첨부 파일의 기본 슬라이더 값 기준) */
const FAB = {
    pull:    0.62,    // 장력 (당김 강도)
    elastic: 0.44,    // 섬유 탄성
    wave:    0.45,    // 드래그 물결
    shade:   0.62,    // 명암 강도
    gloss:   0.12,    // 광택 (실크감)
    spacing: 48,      // 직조 밀도 (격자 크기 약 2배로 확대)
    recover: 0.011    // 복원 속도 (자국이 약 1.5초에 걸쳐 회복)
};

/* 임팩트 시스템 (첨부 파일 방식) */
const impacts = [];          // 공이 지나가며 남긴 자국들 (서서히 회복)
let lastTrailX = null, lastTrailY = null;

// 공이 '현재' 누르고 있는 자리 : 강도가 줄지 않는 지속 임팩트
const ballPress = {
    x: 0, y: 0, dx: 0, dy: 0,
    radius: 110, depth: 46,
    strength: 1, age: 0,
    seed: Math.random() * 999 | 0,
    seed2: Math.random() * 999 | 0,
    angle: 0,
    pullBoost: 1.25,    // 원래보다 실이 살짝만 더 끌려 들어옴
    sharp: true         // 당김이 접촉부 근처에 집중
};

function addTrailImpact(x, y, dx, dy, radius, depth) {
    impacts.push({
        x, y, dx, dy,
        radius, depth,
        recover: FAB.recover,
        strength: 1, age: 0,
        seed: Math.random() * 999 | 0,
        seed2: Math.random() * 999 | 0,
        angle: Math.atan2(dy, dx) || Math.random() * Math.PI * 2
    });
    if (impacts.length > 42) impacts.shift();
}

function tickImpacts(dt) {
    for (let i = impacts.length - 1; i >= 0; i--) {
        const im = impacts[i];
        im.age += dt;
        im.strength -= im.recover * dt;   // 서서히 자연 복원
        if (im.strength <= 0) impacts.splice(i, 1);
    }
    ballPress.age += dt;
}

/* 천 변위 계산 (첨부 fabricDisplace 이식) */
let activeImpacts = [];
function fabDisplace(x, y) {
    let px = 0, py = 0;
    for (const im of activeImpacts) {
        const dx = x - im.x, dy = y - im.y;
        const d = Math.hypot(dx, dy);
        const r = im.radius;
        if (d > r) continue;
        const q = 1 - d / r;
        const fall = q * q * (3 - 2 * q);          // smoothstep
        const s = im.strength;
        const dxN = d ? dx / d : 0, dyN = d ? dy / d : 0;

        // 안쪽으로 당김 (장력) : 실이 눌린 중심을 향해 딸려 들어감
        // 공의 지속 눌림(pullBoost·sharp)은 접촉부에서 훨씬 강하고 가파르게 당겨져
        // 팽팽한 천이 공 무게에 끌려 들어가는 인상을 만든다
        const pb = im.pullBoost || 1;
        const fallP = im.sharp ? Math.pow(fall, 1.6) : fall;
        let inward = -im.depth * 0.22 * FAB.pull * fallP * s * pb;
        if (inward < -d * 0.78) inward = -d * 0.78;   // 깊게 눌려도 실이 중심을 넘어 뒤집히지 않게
        px += dxN * inward;
        py += dyN * inward;

        // 드래그 파동 : 굴러가는 방향으로 천이 밀리며 물결이 퍼짐
        const dragFall = fall * s;
        const waveProp = Math.sin(d * 0.08 - im.age * 0.12 + im.seed) * 0.5 + 0.5;
        px += im.dx * 0.12 * dragFall * FAB.wave * waveProp;
        py += im.dy * 0.12 * dragFall * FAB.wave * waveProp;

        // 진행 방향과 수직인 잔물결 (섬유 탄성)
        const vlen = Math.hypot(im.dx, im.dy) || 1;
        const perp = Math.sin(d * 0.14 - im.age * 0.09 + im.seed2) * FAB.elastic * 0.6 * fall * s;
        px += dyN * perp * (-im.dy / vlen);
        py += dxN * perp * (im.dx / vlen);
    }
    return { x: x + px, y: y + py };
}

/* 천 렌더링 (첨부 drawFabric 이식, 하얀 천 톤으로 변환) */
function drawFabric(w, h, t) {
    // 하얀 천 베이스 그라디언트
    const bg = cCtx.createLinearGradient(0, 0, w * 0.6, h);
    bg.addColorStop(0,   '#fbfaf6');
    bg.addColorStop(0.5, '#f2f0ea');
    bg.addColorStop(1,   '#e2dfd7');
    cCtx.fillStyle = bg;
    cCtx.fillRect(0, 0, w, h);

    const spacing = FAB.spacing;
    const subStep = 4;
    cCtx.save();
    cCtx.lineCap = 'round';

    // ── 씨실 (가로 실) ──
    for (let gy = -spacing; gy < h + spacing; gy += spacing) {
        cCtx.beginPath();
        let first = true;
        for (let gx = -60; gx < w + 60; gx += subStep) {
            const p = fabDisplace(gx, gy);
            const drape = Math.sin(gx * 0.018 + t * 0.006) * 0.4;   // 은은한 늘어짐
            if (first) { cCtx.moveTo(p.x, p.y + drape); first = false; }
            else cCtx.lineTo(p.x, p.y + drape);
        }
        cCtx.strokeStyle = 'rgba(255,255,255,0.55)';
        cCtx.lineWidth = 1.6;
        cCtx.stroke();
        cCtx.strokeStyle = 'rgba(110,103,90,0.22)';
        cCtx.lineWidth = 0.85;
        cCtx.stroke();
    }

    // ── 날실 (세로 실) ──
    for (let gx = -spacing; gx < w + spacing; gx += spacing) {
        cCtx.beginPath();
        let first = true;
        for (let gy = -60; gy < h + 60; gy += subStep) {
            const p = fabDisplace(gx, gy);
            const drape = Math.sin(gy * 0.015 + t * 0.005) * 0.35;
            if (first) { cCtx.moveTo(p.x + drape, p.y); first = false; }
            else cCtx.lineTo(p.x + drape, p.y);
        }
        cCtx.strokeStyle = 'rgba(95,89,78,0.22)';
        cCtx.lineWidth = 1.3;
        cCtx.stroke();
        cCtx.strokeStyle = 'rgba(255,255,255,0.28)';
        cCtx.lineWidth = 0.6;
        cCtx.stroke();
    }

    // ── 임팩트별 눌림 음영 + 실크 광택 (첨부 방식) ──
    for (const im of activeImpacts) {
        const r = im.radius;
        if (im.strength <= 0) continue;
        const s = im.strength * (im.shadeK || 1);

        // 눌린 그릇 모양 그림자 : 경계선이 생기지 않도록
        // 원 전체(반경 r)에 칠하고, 가장자리로 갈수록 매끄러운 곡선으로 0까지 사라지게 함
        const a0 = 0.16 * FAB.shade * s;
        const sdw = cCtx.createRadialGradient(im.x, im.y, 0, im.x, im.y, r);
        for (let i = 0; i <= 12; i++) {
            const x = i / 12;
            const f = Math.pow(1 - x * x * (3 - 2 * x), 1.6);   // 1 → 0, 끝에서 기울기도 0
            sdw.addColorStop(x, `rgba(${(74 + 46 * x) | 0}, ${(68 + 44 * x) | 0}, ${(58 + 42 * x) | 0}, ${(a0 * f).toFixed(4)})`);
        }
        cCtx.fillStyle = sdw;
        cCtx.beginPath();
        cCtx.arc(im.x, im.y, r, 0, Math.PI * 2);
        cCtx.fill();

        // 눌린 자국 가장자리의 실크 광택
        const hx2 = im.x - r * 0.2, hy2 = im.y - r * 0.25;
        const hl = cCtx.createRadialGradient(hx2, hy2, 0, hx2, hy2, r * 0.4);
        // 광택은 그늘 배율(shadeK)을 받지 않고, 깊게 눌릴수록 오히려 줄어듦 (구멍 안쪽은 빛이 덜 닿음)
        const gs = im.strength / (im.shadeK || 1);
        hl.addColorStop(0, `rgba(255,255,255,${0.30 * FAB.gloss * gs + 0.05 * gs})`);
        hl.addColorStop(1, 'rgba(255,255,255,0)');
        cCtx.fillStyle = hl;
        cCtx.beginPath();
        cCtx.arc(hx2, hy2, r * 0.4, 0, Math.PI * 2);    // 그라디언트 반경과 같게 → 잘린 경계 없음
        cCtx.fill();
    }
    cCtx.restore();
}

function updateSim3(t, dt) {
    const W = window.innerWidth, H = window.innerHeight;
    const R0 = BALL_R;
    if (B3.x === null) {
        B3.x = W / 2; B3.y = H / 2;
        lastTrailX = B3.x; lastTrailY = B3.y;
    }

    /* ① 공 물리 : 천 위라 구름 저항이 크고 벽 반발이 부드러움 */
    if (started) {
        const gAcc = 0.36;
        B3.vx += Math.sin(gamma * Math.PI / 180) * gAcc * dt;
        B3.vy += Math.sin(beta  * Math.PI / 180) * gAcc * dt;
        B3.vx *= Math.pow(0.978, dt);
        B3.vy *= Math.pow(0.978, dt);
        // 팽팽한 천의 눌림 골 저항 : 느려지면 자기 골에 안착하듯 멈춘다
        const spd3 = Math.hypot(B3.vx, B3.vy);
        if (spd3 < 1.1) { B3.vx *= Math.pow(0.93, dt); B3.vy *= Math.pow(0.93, dt); }
        B3.x += B3.vx * dt;
        B3.y += B3.vy * dt;
        const topLimit = R0 + 54;
        let hitWall = false, hit3 = 0;
        if (B3.x < R0)     { B3.x = R0;     hit3 = Math.abs(B3.vx); B3.vx = -B3.vx * 0.35; hitWall = true; }
        if (B3.x > W - R0) { B3.x = W - R0; hit3 = Math.abs(B3.vx); B3.vx = -B3.vx * 0.35; hitWall = true; }
        if (B3.y < topLimit) { B3.y = topLimit; hit3 = Math.max(hit3, Math.abs(B3.vy)); B3.vy = -B3.vy * 0.35; hitWall = true; }
        if (B3.y > H - R0) { B3.y = H - R0; hit3 = Math.max(hit3, Math.abs(B3.vy)); B3.vy = -B3.vy * 0.35; hitWall = true; }
        // 천이 출렁이며 공을 받아내는 반동
        if (hitWall) B3.scaleVel += 0.05;
        // 천에 툭 걸리는 두툼한 진동 (강하면 두 번)
        if (hit3 > 0.8) {
            const d = Math.min(30, 10 + hit3 * 1.6) | 0;
            vibe(hit3 > 4 ? [d, 20, Math.max(6, d - 8)] : d);
        }

        B3.rollAngle += Math.hypot(B3.vx, B3.vy) * dt / R0;

        // 부드러운 천 위 굴림 진동 : 성기고 낮게, 실 격자를 넘을 때만
        // (spacing 48px 간격에 맞춰 자주 나지 않고 웅웅거림)
        const sp3 = Math.hypot(B3.vx, B3.vy);
        if (sp3 > 0.5) {
            rollTick3 -= dt * (0.28 + sp3 * 0.15);     // 시뮬2보다 훨씬 성기게
            if (rollTick3 <= 0) {
                const d = Math.min(18, 8 + sp3 * 0.9);
                vibe(d | 0);
                rollTick3 = 8 + Math.random() * 4;
            }
        } else rollTick3 = 0;
    }

    /* ①-b 누름 상태 : 누르고 있으면 천 속으로 점점 가라앉고 (공은 작아짐),
       놓으면 천이 트램펄린처럼 되튕기며 공이 떠올라 커졌다가 원래 크기로 */
    if (B3.hold) {
        B3.sink += (1 - B3.sink) * 0.035 * dt;          // 약 1.2초에 걸쳐 깊숙이
        B3.sinkVel = 0;
        B3.scaleTarget = 1 - 0.36 * B3.sink;             // 멀어지는 만큼 작아 보임
        B3.vx *= Math.pow(0.8, dt); B3.vy *= Math.pow(0.8, dt);   // 천에 파묻혀 굴러가지 않음
        B3.sinkTick -= dt;
        if (B3.sinkTick <= 0 && B3.sink < 0.95) { vibe((5 + B3.sink * 12) | 0); B3.sinkTick = 9; }
    } else {
        B3.sinkVel += (0 - B3.sink) * 0.18 * dt;         // 천의 복원력
        B3.sinkVel *= Math.pow(0.78, dt);
        B3.sink += B3.sinkVel * dt;
        if (Math.abs(B3.sink) < 0.002 && Math.abs(B3.sinkVel) < 0.002) { B3.sink = 0; B3.sinkVel = 0; }
    }
    const sinkP = Math.max(0, B3.sink);

    updateScaleSpring(B3);
    const R = R0 * B3.scale;

    /* ② 공 = 임팩트 :
       현재 자리는 지속적으로 눌려 있고 (첨부의 pointerdown에 해당),
       일정 거리 굴러갈 때마다 자국 임팩트를 남긴다 (pointermove 드래그에 해당) */
    ballPress.x = B3.x;
    ballPress.y = B3.y;
    ballPress.dx = B3.vx * 1.6;
    ballPress.dy = B3.vy * 1.6;
    ballPress.angle = Math.atan2(B3.vy, B3.vx) || ballPress.angle;
    // 가라앉을수록 천이 넓고 깊게 공 쪽으로 빨려 들어감 / 튕겨 오를 때(공이 커질 때)는 천이 가벼워짐
    const lift = B3.scale > 1 ? 1 / Math.pow(B3.scale, 4) : 1;
    ballPress.radius = R0 * (2.4 + 1.9 * sinkP);
    ballPress.depth  = (50 + 230 * B3.sink) * lift;
    ballPress.pullBoost = 1.25 + 1.1 * sinkP;
    ballPress.shadeK = 1 + 3.4 * sinkP;
    ballPress.strength = 1;                            // 공이 있는 동안은 회복되지 않음

    const moved = Math.hypot(B3.x - lastTrailX, B3.y - lastTrailY);
    if (moved > 15) {
        // 무거운 금속 공이 지나간 자국 : 뒤에 남았다가 서서히 회복
        addTrailImpact(B3.x, B3.y, B3.vx * 1.6, B3.vy * 1.6, R * 2.1, 40 * B3.scale);
        lastTrailX = B3.x; lastTrailY = B3.y;
    }

    tickImpacts(dt);
    activeImpacts = impacts.concat([ballPress]);

    /* ③ 천 렌더링 */
    cCtx.clearRect(0, 0, W, H);
    drawFabric(W, H, t);

    // 부드러운 주변광 비네트
    const vg = cCtx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.45, W/2, H/2, Math.max(W,H)*0.8);
    vg.addColorStop(0, 'rgba(180, 175, 165, 0)');
    vg.addColorStop(1, 'rgba(180, 175, 165, 0.25)');
    cCtx.fillStyle = vg;
    cCtx.fillRect(0, 0, W, H);

    /* ④ 공의 그림자 : 접촉부 진하고 좁게 + 외곽 넓고 연하게 */
    const lightX = W / 2, lightY = -H * 0.25;
    let dx = lightX - B3.x, dy = lightY - B3.y;
    const d = Math.hypot(dx, dy) || 1;
    dx /= d; dy /= d;

    const sox = B3.x - dx * R * 0.55, soy = B3.y - dy * R * 0.55 + R * 0.15;
    const soft = cCtx.createRadialGradient(sox, soy, R * 0.3, sox, soy, R * 1.7);
    soft.addColorStop(0, 'rgba(90, 84, 74, 0.28)');
    soft.addColorStop(1, 'rgba(90, 84, 74, 0)');
    cCtx.beginPath();
    cCtx.ellipse(sox, soy, R * 1.7, R * 1.45, Math.atan2(-dy, -dx), 0, Math.PI * 2);
    cCtx.fillStyle = soft;
    cCtx.fill();

    const core = cCtx.createRadialGradient(B3.x, B3.y + R * 0.12, R * 0.1, B3.x, B3.y + R * 0.12, R * 0.95);
    core.addColorStop(0, 'rgba(60, 55, 47, 0.45)');
    core.addColorStop(1, 'rgba(60, 55, 47, 0)');
    cCtx.beginPath();
    cCtx.ellipse(B3.x, B3.y + R * 0.12, R * 0.95, R * 0.82, 0, 0, Math.PI * 2);
    cCtx.fillStyle = core;
    cCtx.fill();

    /* ⑤ 크롬 공 */
    drawChromeBall(cCtx, B3, R, W, H, t, 'cloth');

    /* ⑥ 깊이 들어갈수록 빛이 덜 닿음 : 공 자체를 살짝 어둡게 (중심보다 가장자리가 더 어둡게) */
    if (sinkP > 0.02) {
        const dim = cCtx.createRadialGradient(B3.x, B3.y - R * 0.25, R * 0.1, B3.x, B3.y, R);
        dim.addColorStop(0, `rgba(38, 34, 28, ${0.32 * sinkP})`);
        dim.addColorStop(1, `rgba(38, 34, 28, ${0.58 * sinkP})`);
        cCtx.beginPath();
        cCtx.arc(B3.x, B3.y, R, 0, Math.PI * 2);
        cCtx.fillStyle = dim;
        cCtx.fill();

        /* ⑦ 공 가장자리를 덮는 천 : 밝은 천색 대신 그늘진 주름 톤 (움푹한 구멍 안쪽이 어두움) */
        const inner = R * (0.98 - 0.3 * sinkP);
        const wrap = cCtx.createRadialGradient(B3.x, B3.y, inner, B3.x, B3.y, R * 1.12);
        wrap.addColorStop(0,    'rgba(92, 85, 74, 0)');
        wrap.addColorStop(0.45, `rgba(92, 85, 74, ${0.45 * sinkP})`);
        wrap.addColorStop(0.8,  `rgba(120, 112, 99, ${0.5 * sinkP})`);
        wrap.addColorStop(1,    'rgba(150, 142, 128, 0)');
        cCtx.beginPath();
        cCtx.arc(B3.x, B3.y, R * 1.12, 0, Math.PI * 2);
        cCtx.fillStyle = wrap;
        cCtx.fill();
    }
}

/* 시뮬레이터-3 : 볼 터치만 반응 (배경 천 터치 눌림은 없음) */
cCanvas.addEventListener('pointerdown', (e) => {
    const rect = cCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (B3.x !== null && Math.hypot(mx - B3.x, my - B3.y) < 62) {
        e.preventDefault();
        B3.hold = true; B3.sinkTick = 0;   // 누르고 있는 동안 천 속으로 가라앉음 (updateSim3)
        vibe([8, 25, 14]);
    }
});
/* 손을 놓으면 : 천이 되튕기며 공이 위로 떠올라 커졌다가 원래 크기로 */
function release3() {
    if (!B3.hold) return;
    B3.hold = false;
    const k = Math.max(0.25, B3.sink);
    B3.sinkVel = -0.05 * k;                   // 천이 위로 되튕김
    B3.scaleTarget = 1 + 0.2 * k;             // 튕겨 오르며 커짐 (스프링 반동 포함 정점 약 1.35배)
    B3.scaleVel += 0.03 * k;
    clearTimeout(release3.t);
    release3.t = setTimeout(() => { if (!B3.hold) B3.scaleTarget = 1; }, 170);   // 정점 뒤 원래 크기로 내려앉음
    vibe([18, 24, 8]);
}
['pointerup', 'pointercancel'].forEach(ev => window.addEventListener(ev, release3));

/* ── 음악 (TV 시뮬레이터 v207의 힐링 뮤직 스테이션 링크) ── */
const MZ4 = 'lp_violin-concertos_wolfgang-amadeus-mozart-wolfgang-schneider/';

const knob4 = { on:false, pid:null, last:0, moved:0, center:null, kind:'volume', ball:false, acc:0 };
const DETENT4 = 40 * DEG;          // NEXT 다이얼 : 40°마다 한 곡 (시계 = 다음, 반시계 = 이전)
let nextAng4 = 0;
function knobStart4(e, centerFn, kind, fromBall) {
  const c = centerFn();
  Object.assign(knob4, { on:true, pid:e.pointerId, moved:0, center:centerFn, kind, ball:fromBall, acc:0,

/* ── 흔들기 : 휴대폰을 흔들면 다음 단계로 ──

/* ── 기울기 : 화면 평면 위 중력 방향 (beta·gamma를 합쳐 계산 → 세워 들어도 안정) ── */
function tilt4() {
  if (gotOri) {
    const b = oriBeta * DEG, g = oriGamma * DEG;
    const x = Math.cos(b) * Math.sin(g), y = Math.sin(b);
    if (!G4.base) G4.base = { x, y };        // 처음 값(또는 재설정 순간)의 자세를 0°로
    return { x:x - G4.base.x, y:y - G4.base.y, live:true };
  }

}

/* ── 메인 업데이트 ── */
function updateSim4(t, dt) {
  if (!G4.inited) { resize4(); if (!G4.inited) return; }
  const B = G4.ball, id = SEQ4[G4.step], LB = LB4[id], n = G4.step + 1;
  const tv = tilt4();
  G4.ax += (tv.x - G4.ax) * 0.15;
  G4.ay += (tv.y - G4.ay) * 0.15;
  const degX = Math.asin(clamp4(G4.ax, -1, 1)) / DEG, degY = Math.asin(clamp4(G4.ay, -1, 1)) / DEG;
  if (tv.live) slider4.value = Math.round(clamp4(degX, -20, 20));

  if (t - G4.lastRead > 200) {
    G4.lastRead = t;
    readout4.innerHTML = tv.live
      ? `센서 수신 중 · 좌우 <b>${degX >= 0 ? '+' : ''}${degX.toFixed(1)}°</b> · 앞뒤 <b>${degY >= 0 ? '+' : ''}${degY.toFixed(1)}°</b>`
      : (started ? '센서 값 없음 · 하단 안내를 확인하세요. 지금은 슬라이더로 동작해요'
                 : '센서 대기 · 위의 시작 버튼을 누르거나 슬라이더로 기울기를 흉내 내세요');
  }

  if (!G4.armed && G4.manual) {
    if (Math.hypot(G4.ax, G4.ay) < Math.sin(TRIG4 * DEG)) G4.armed = true;
    else if (G4.statKey !== 'flash') setStat4('rearm' + n, `${n}단계 · 폰을 수평으로 되돌리면 ${LB} 구슬이 준비돼요`);
  } else if (!G4.settled) {
    /* 가상 바닥 : 오른쪽으로 기울이면 오른쪽 아래(엄지) 방향으로 휘어지는 홈을 따라 흐름 */
    const gA = 0.42;
    let fx, fy;
    if (G4.manual) {
      fx = G4.ax * gA;
      fy = (G4.ay + 0.8 * Math.max(0, G4.ax)) * gA;
      const spd0 = Math.hypot(B.vx, B.vy);
      if (spd0 < 0.05 && Math.hypot(fx, fy) < Math.sin(TRIG4 * DEG) * gA && !G4.inZone) { fx = fy = 0; B.vx *= .5; B.vy *= .5; }
    } else {
      /* 자동 : 구슬이 된 뒤 잠깐 멈췄다가, 스스로 엄지 존 쪽으로 기울어진 바닥을 따라 굴러감

      const zc = zoneC4(), ex = zc.x - B.x, ey = zc.y - B.y, ed = Math.hypot(ex, ey) || 1;
      const wait = performance.now() - G4.actT < 450;
      const a = wait ? 0 : 0.11 * Math.min(1, ed / 140 + 0.25);

      // 목표 방향과 어긋난 속도 성분은 빨리 줄여 곧게 굴러가게
      const along = (B.vx * ex + B.vy * ey) / ed;

    B.vx *= Math.pow(0.988, dt); B.vy *= Math.pow(0.988, dt);

    /* Thumb Zone = 오목한 접시 : 들어오면 중심으로 끌리며 빠르게 감쇠 → 제자리에 쏙 안착 */
    const z = zoneC4(), zx = z.x - B.x, zy = z.y - B.y, zd = Math.hypot(zx, zy);
    const cr = z.r * CAPTURE4;
    if (zd < cr) {
      if (!G4.inZone) { G4.inZone = true; vibe(10); }
      B.vx += zx * 0.006 * dt; B.vy += zy * 0.006 * dt;
      B.vx *= Math.pow(0.93, dt); B.vy *= Math.pow(0.93, dt);
    } else G4.inZone = false;

    B.x += B.vx * dt; B.y += B.vy * dt;

    let hit = 0;
    if (B.x < R4)      { B.x = R4;      hit = Math.abs(B.vx); B.vx = -B.vx * 0.62; }
    if (B.x > W4 - R4) { B.x = W4 - R4; hit = Math.abs(B.vx); B.vx = -B.vx * 0.62; }
    if (B.y < R4)      { B.y = R4;      hit = Math.max(hit, Math.abs(B.vy)); B.vy = -B.vy * 0.62; }
    if (B.y > H4 - R4) { B.y = H4 - R4; hit = Math.max(hit, Math.abs(B.vy)); B.vy = -B.vy * 0.62; }
    if (hit > 0.6) vibe(Math.min(35, 8 + hit * 2) | 0);

    const spd = Math.hypot(B.vx, B.vy);
    B.rollAngle += spd * dt / R4;
    if (spd > 0.35) {                         // 시뮬레이터-2와 같은 굴러가는 톡톡 진동
      G4.rollTick -= dt * (0.6 + spd * 0.35);
      if (G4.rollTick <= 0) { vibe(Math.min(12, 3 + spd * 0.7) | 0); G4.rollTick = 3.5 + Math.random() * 1.5; }
    } else G4.rollTick = 0;

    const zd2 = Math.hypot(z.x - B.x, z.y - B.y);
    if (G4.inZone && zd2 < cr * 0.4 && spd < 0.45) {   // 접시 바닥 근처에서 거의 멈추면 중심으로 쏙
      /* 안착 : 중심에 맞추고, 살짝 가라앉았다 튀어 오르는 스프링 + 묵직한 진동 */
      G4.settled = true; B.x = z.x; B.y = z.y; B.vx = B.vy = 0;
      B.scaleVel -= 0.07; vibe([12, 30, 6]);
      zone4.classList.add('lit');
    }
    if (G4.statKey !== 'flash') {
      if (spd > 0.3) setStat4('roll' + n, `${n}단계 · ${LB} 구슬이 굴러가는 중`);
      else if (!G4.inZone) setStat4('idle' + n, `${n}단계 · ${LB} 차례 · 오른쪽으로 기울여 엄지 쪽으로 굴려 보세요`);
    }
  } else {
    const z = zoneC4(); B.x = z.x; B.y = z.y;
    if (G4.statKey !== 'flash') setStat4('set' + n + mus4.playing, id === 'volume'
      ? `${n}단계 · VOLUME 안착 · 돌려서 볼륨 조절 · 누르거나 흔들면 다음`
      : id === 'next'
        ? `${n}단계 · NEXT 안착 · 시계 방향 다음 곡 / 반대 이전 곡 · 누르거나 흔들면 다음`
        : mus4.playing
          ? `${n}단계 · 재생 중 · 누르면 일시정지 · 흔들면 다음 단계`
          : `${n}단계 · PLAY 안착 · 눌러서 재생 · 흔들면 다음 단계`);
  }

  updateScaleSpring(B);
  draw4(t);
}

function draw4(t) {
  const B = G4.ball, W = W4, H = H4, R = R4 * B.scale, id = SEQ4[G4.step];
  ctx4.clearRect(0, 0, W, H);

  /* 시뮬레이터-2와 같은 탑뷰 그림자 + 접촉 음영 */
  const speed = Math.hypot(B.vx, B.vy);
  let dx = W / 2 - B.x, dy = -H * 0.25 - B.y;
  const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;

  drawChromeBall(ctx4, B, R, W, H, t, 'floor');

  ctx4.save();

      ctx4.beginPath();
      ctx4.moveTo(B.x + Math.cos(a) * R * 0.8, B.y + Math.sin(a) * R * 0.8);
      ctx4.lineTo(B.x + Math.cos(a) * R * 0.93, B.y + Math.sin(a) * R * 0.93);
      ctx4.stroke();
    }
    ctx4.fillStyle = '#7dd3fc'; ctx4.shadowColor = 'rgba(125,211,252,.9)'; ctx4.shadowBlur = 6;
    ctx4.beginPath(); ctx4.arc(B.x + Math.cos(a1) * R * 0.66, B.y + Math.sin(a1) * R * 0.66, 3.2, 0, Math.PI * 2); ctx4.fill();
    ctx4.shadowBlur = 0;

    engrave4('VOL', B.x, B.y - 15 * B.scale, '700 10px system-ui, sans-serif');
  } else if (id === 'next') {
    for (let k = 0; k < 28; k++) {

      ctx4.strokeStyle = 'rgba(20,26,32,.35)'; ctx4.lineWidth = 1.2;

    ctx4.shadowBlur = 0;
    engrave4('NEXT', B.x, B.y + 2, '800 14px system-ui, sans-serif');
    engrave4('◀     ▶', B.x, B.y + 17 * B.scale, '700 9px system-ui, sans-serif');
  } else {
    engrave4(mus4.playing ? 'PAUSE' : 'PLAY', B.x, B.y, '800 14px system-ui, sans-serif');
  }

}

function jamo5(j) {

  if (!isV) {

      const sp = SPLIT5[c.jong] || [null, c.jong];

function sendMsg5() {
  commit5();
  const t = T5.text.replace(/\s+$/, '');
  if (!t.trim()) return;
  const b = document.createElement('div'); b.className = 'p5-b out'; b.textContent = t;
  const d = new Date(), tm = document.createElement('div'); tm.className = 'p5-t';
  tm.textContent = (d.getHours() < 12 ? '오전 ' : '오후 ') + ((d.getHours() + 11) % 12 + 1) + ':' + String(d.getMinutes()).padStart(2, '0');
  msgs5.append(b, tm); msgs5.scrollTop = msgs5.scrollHeight;
  T5.text = ''; T5.cur = {}; T5.stack = [{}];
  renderField5(); vibe([8, 30, 8]);
}
send5.addEventListener('click', sendMsg5);

/* ── 자판 배열 ── */
const KO5  = ['ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔ', 'ㅁㄴㅇㄹㅎㅗㅓㅏㅣ', 'ㅋㅌㅊㅍㅠㅜㅡ'];
const KOS5 = ['ㅃㅉㄸㄲㅆㅛㅕㅑㅒㅖ', 'ㅁㄴㅇㄹㅎㅗㅓㅏㅣ', 'ㅋㅌㅊㅍㅠㅜㅡ'];
const EN5  = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
const SYM5 = [['1','2','3','4','5','6','7','8','9','0'], ['!','@','#','₩','%','^','&','*','(',')'], ['~','-','\'','"',':',';','?','/']];
const K5 = { lang:'ko', shift:0, sym:false, lastShift:0 };   // shift: 0 끔, 1 한 번, 2 고정(영문)

function keyHTML5(k, cls, label, sup) {
  return `<div class="k5 ${cls || ''}" data-k="${esc5(k)}">${label != null ? label : esc5(k)}${sup ? '<sup>' + sup + '</sup>' : ''}</div>`;
}
function buildKeys5() {
  let rows;
  if (K5.sym) rows = SYM5;
  else if (K5.lang === 'ko') rows = (K5.shift ? KOS5 : KO5).map(r => Array.from(r));
  else rows = EN5.map(r => Array.from(K5.shift ? r.toUpperCase() : r));
  let h = '';
  // 1열 : 숫자 힌트 (길게 누르면 숫자)
  h += '<div class="k5-row">' + rows[0].map((k, i) => keyHTML5(k, '', null, K5.sym ? '' : String((i + 1) % 10))).join('') + '</div>';
  // 2열 : 삼성처럼 반 칸 들여쓰기 (9키)
  const pad = rows[1].length < 10 ? '<div class="k5 gap"></div>' : '';
  h += '<div class="k5-row">' + pad + rows[1].map(k => keyHTML5(k)).join('') + pad + '</div>';
  // 3열 : Shift + 글자 + 지우기
  const shCls = 'fn w15' + (K5.shift === 2 ? ' lock' : K5.shift ? ' lit' : '');
  h += '<div class="k5-row">' + (K5.sym ? keyHTML5('#sym2', 'fn w15', '1/2') : keyHTML5('#shift', shCls, '⇧'))
     + rows[2].map(k => keyHTML5(k)).join('') + keyHTML5('#back', 'fn w15', '⌫') + '</div>';
  // 4열 : !#1 · 한/영 · , · 스페이스 · . · 엔터
  h += '<div class="k5-row">'
     + keyHTML5('#sym', 'fn w13', K5.sym ? (K5.lang === 'ko' ? '가' : 'ABC') : '!#1')
     + keyHTML5('#lang', 'fn w11', K5.lang === 'ko' ? '한/<span style="opacity:.5">영</span>' : '<span style="opacity:.5">한</span>/영')
     + keyHTML5(',', 'fn')
     + keyHTML5(' ', 'sp', K5.lang === 'ko' ? '한국어' : 'English')
     + keyHTML5('.', 'fn')
     + keyHTML5('#enter', 'fn w15', '↵')
     + '</div>';
  board5.innerHTML = h;
}

/* ── 키 소리 : 짧은 딸깍 ── */
function click5(fn) {
  const ac = actx4; if (!ac || ac.state !== 'running') return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(fn ? 520 : 760, t); o.frequency.exponentialRampToValueAtTime(fn ? 260 : 380, t + 0.03);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.06);
}

/* ── 키 입력 처리 ── */
function typeKey5(k) {
  if (k === '#back')  { back5(); }
  else if (k === '#enter') { put5('\n'); }
  else if (k === '#shift') {
    const now = performance.now();
    if (K5.lang === 'en' && K5.shift === 1 && now - K5.lastShift < 350) K5.shift = 2;
    else K5.shift = K5.shift ? 0 : 1;
    K5.lastShift = now; buildKeys5(); return;
  }
  else if (k === '#lang') { commit5(); K5.lang = K5.lang === 'ko' ? 'en' : 'ko'; K5.shift = 0; K5.sym = false; buildKeys5(); }
  else if (k === '#sym')  { commit5(); K5.sym = !K5.sym; K5.shift = 0; buildKeys5(); }
  else if (k === '#sym2') { return; }
  else if (k === ' ') { put5(' '); }
  else if (!K5.sym && K5.lang === 'ko' && (CHO5.includes(k) || JUNG5.includes(k))) {
    jamo5(k);
    if (K5.shift === 1) { K5.shift = 0; buildKeys5(); }
  } else {
    put5(k);
    if (K5.shift === 1) { K5.shift = 0; buildKeys5(); }
  }
  renderField5();
}

const press5 = new Map();   // pointerId → { el, k, long, t }
let rep5 = null;
function showPop5(el, txt) {
  const kr = kb5.getBoundingClientRect(), r = el.getBoundingClientRect();
  pop5.textContent = txt; pop5.style.display = 'flex';
  const w = Math.max(44, r.width + 8);
  pop5.style.minWidth = w + 'px';
  pop5.style.left = Math.max(2, Math.min(kr.width - w - 2, r.left - kr.left + r.width / 2 - w / 2)) + 'px';
  pop5.style.top = (r.top - kr.top - 60) + 'px';
}
function hidePop5() { pop5.style.display = 'none'; }

board5.addEventListener('pointerdown', e => {
  const el = e.target.closest('.k5'); if (!el || el.classList.contains('gap')) return;
  e.preventDefault(); ensureCtx4();
  const k = el.dataset.k, fn = k.length > 1 && k[0] === '#';
  el.classList.add('down'); vibe(6); click5(fn || k === ' ');
  const P = { el, k, long:false, t:0 };
  press5.set(e.pointerId, P);
  if (!fn && k !== ' ') showPop5(el, k);
  if (k === '#back') {                         // 지우기 : 누르는 즉시 + 길게 누르면 연속 삭제
    typeKey5(k); P.long = true;
    clearInterval(rep5); rep5 = setTimeout(function r() { typeKey5('#back'); vibe(4); rep5 = setTimeout(r, 60); }, 420);
  } else if (el.querySelector('sup') && el.querySelector('sup').textContent) {   // 1열 길게 → 숫자
    const num = el.querySelector('sup').textContent;
    P.t = setTimeout(() => { P.long = true; put5(num); renderField5(); showPop5(el, num); vibe(12); }, 380);
  }
});
function release5(e) {
  const P = press5.get(e.pointerId); if (!P) return;
  press5.delete(e.pointerId);
  clearTimeout(P.t); P.el.classList.remove('down');
  if (P.k === '#back') { clearTimeout(rep5); rep5 = null; }
  if (!P.long && e.type === 'pointerup') typeKey5(P.k);
  if (!press5.size) hidePop5();
}
window.addEventListener('pointerup', release5);
window.addEventListener('pointercancel', release5);

/* ── 모드 전환 ── */
function setMode5(m, why) {
  if (G5.mode === m) return;
  G5.mode = m; G5.target = m;
  modeLb5.textContent = MODE_LB5[m];
  vibe(m ? [10, 30, 6] : [6, 20, 6]);
}
q5('swap5').addEventListener('click', () => setMode5(-G5.mode || 1));
q5('full5').addEventListener('click', () => setMode5(0));
q5('calib5').addEventListener('click', () => { G5.base = null; });
function onShake5() { setMode5(0); }   // 흔들면 가운데 (다음에 다른 구역으로 기울이면 다시 따라감)

/* 시뮬레이터-4와 같은 기울기 계산 (beta·gamma → 화면 평면 위 좌우 중력 성분) */
function tilt5() {
  if (gotOri) {
    const b = oriBeta * DEG, g = oriGamma * DEG;
    const x = Math.cos(b) * Math.sin(g);
    if (G5.base == null) G5.base = x;
    return { x:x - G5.base, live:true };
  }
  return { x:Math.sin(+slider5.value * DEG), live:false };
}
/* 펼친 폴드(가로 560px 이상)인지 판단 → 폭 제한 해제 + 한 손 자판을 절반 크기로 */
function layout5() {
  const wide = window.innerWidth >= 560;
  if (wide !== G5.wide) { G5.wide = wide; q5('panel5').classList.toggle('wide', wide); }
  G5.one = wide ? ONE_FOLD5 : ONE_PHONE5;
}
function resize5() { layout5(); G5.K = kb5.clientWidth; G5.applied = ''; }
window.addEventListener('resize', resize5);
layout5();
if (window.ResizeObserver) new ResizeObserver(resize5).observe(kb5);

function updateSim5(t, dt) {
  if (!G5.K) { resize5(); if (!G5.K) return; }
  const tv = tilt5();
  G5.ax += (tv.x - G5.ax) * 0.18;
  const deg = Math.asin(clamp4(G5.ax, -1, 1)) / DEG, ad = Math.abs(deg);
  if (tv.live) slider5.value = Math.round(clamp4(deg, -25, 25));

  /* 구역 판정 : ±10° 안은 가운데, 넘으면 그쪽 한 손 자판 (경계 2° 여유 + 짧은 머무름) */
  let z;
  if (ad > DEAD5) z = deg > 0 ? 1 : -1;
  else if (ad < DEAD5 - HYST5) z = 0;
  else z = G5.zone;
  if (z !== G5.zone) {
    if (z !== G5.pend) { G5.pend = z; G5.pendT = t; }
    else if (t - G5.pendT > DWELL5) { G5.zone = z; setMode5(z); }
  } else G5.pend = z;
  const tgt = G5.target;

  /* 스프링 : 살짝 지나쳤다가 제자리 */
  G5.sv += (tgt - G5.s) * 0.14 * dt;
  G5.sv *= Math.pow(0.74, dt);
  G5.s = clamp4(G5.s + G5.sv * dt, -1.04, 1.04);

  const K = G5.K, a = Math.min(1, Math.abs(G5.s));
  const w = K * (1 - (1 - G5.one) * Math.abs(G5.s));
  const left = G5.s > 0 ? K - w : 0;
  const key = w.toFixed(1) + '|' + left.toFixed(1);
  if (key !== G5.applied) {
    G5.applied = key;
    board5.style.width = w + 'px'; board5.style.marginLeft = left + 'px';
    const sideW = K - w, show = a > 0.3;
    side5.style.width = sideW + 'px';
    side5.style.left = G5.s > 0 ? '0' : (K - sideW) + 'px';
    side5.style.opacity = show ? Math.min(1, (a - 0.3) / 0.5) : 0;
    side5.style.pointerEvents = show ? 'auto' : 'none';
  }

  if (t - G5.lastRead > 200) {
    G5.lastRead = t;
    readout5.innerHTML = (tv.live
      ? `센서 수신 중 · 좌우 <b>${deg >= 0 ? '+' : ''}${deg.toFixed(1)}°</b>`
      : (started ? '센서 값 없음 · 슬라이더로 기울기를 흉내 내세요' : '센서 대기 · 시작 버튼을 누르거나 슬라이더를 움직이세요'))
      + ` · ±${DEAD5}° 안은 가운데` + (G5.wide ? ' · 폴드 화면' : '');
  }
}

buildKeys5(); renderField5();

</script>
